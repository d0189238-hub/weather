name: 截圖檢查
on: workflow_dispatch
jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - env:
          K: ${{ secrets.CWA_KEY }}
        run: |
          for id in F-A0010-001 F-A0011-001 F-A0012-002 F-A0021-001 F-B0053-001 F-B0053-031 F-C0033-001 F-C0033-002 F-C0034-001 F-C0034-002 F-C0034-003 F-C0034-004 F-C0035-002 F-C0035-016 F-C0035-018 F-D0047-091 F-A0085-002 F-A0085-003 F-A0085-004 F-A0085-005 W-C0033-001 W-C0034-005 F-C0032-001 F-C0032-002; do
            r=$(curl -sL -m 20 "https://opendata.cwa.gov.tw/fileapi/v1/opendataapi/$id?Authorization=$K&downloadType=WEB&format=JSON" | head -c 4000)
            echo "== $id $(echo "$r" | grep -o '"\(DatasetDescription\|datasetDescription\|ResourceDesc\|ProductURL\|message\)": "[^"]*"' | head -3 | tr '\n' ' ')"
          done
          curl -sL -m 20 "https://opendata.cwa.gov.tw/fileapi/v1/opendataapi/F-C0032-026?Authorization=$K&downloadType=WEB&format=JSON" | python3 -c "import sys,json;print('NANTOU',json.dumps(json.load(sys.stdin),ensure_ascii=False)[-2500:])"
