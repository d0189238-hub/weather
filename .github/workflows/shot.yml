name: 截圖檢查
on: workflow_dispatch
jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - env:
          K: ${{ secrets.CWA_KEY }}
        run: |
          for id in F-C0035-015 F-C0035-017 F-C0035-001; do
            for f in XML PNG JPG ""; do
              u="https://opendata.cwa.gov.tw/fileapi/v1/opendataapi/$id?Authorization=$K&downloadType=WEB"; [ -n "$f" ] && u="$u&format=$f"
              curl -s -m 20 -D h.txt -o b.bin "$u"; echo "== $id $f $(grep -i 'content-type\|location' h.txt | tr -d '\r' | tr '\n' ' ') size=$(stat -c %s b.bin) $(head -c 400 b.bin | tr -cd '[:print:]')"
            done
          done
