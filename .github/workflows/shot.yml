name: 截圖檢查
on: workflow_dispatch
jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - env:
          K: ${{ secrets.CWA_KEY }}
        run: |
          for id in F-C0035-002 F-C0035-004 F-C0035-005 F-C0035-015 F-C0035-016 F-C0035-017 F-C0035-018 F-C0035-025 F-C0035-001; do
            echo "== $id $(curl -s -m 20 "https://opendata.cwa.gov.tw/fileapi/v1/opendataapi/$id?Authorization=$K&downloadType=WEB&format=JSON" | head -c 600 | tr '\n' ' ')"
          done
