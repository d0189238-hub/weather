name: 截圖檢查
on: workflow_dispatch
jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for f in dem.json fc.json towncoords.json obs.json towns-topo.json; do
            curl -sL -m 60 -o "$f" "https://d0189238-hub.github.io/weather/data/$f"
          done
          tar czf d.tgz *.json; ls -la
          echo "B64START"; base64 -w 4000 d.tgz; echo "B64END"
