name: 截圖檢查
on: workflow_dispatch
jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for n in 015 017 023 024; do
            curl -sL -m 30 -o q.png "https://cwaopendata.s3.ap-northeast-1.amazonaws.com/Forecast/F-C0035-$n.png"
            echo "B64START $n"; base64 -w 4000 q.png; echo "B64END"
          done
