name: 更新天氣資料並發布網站

on:
  push:
    branches: [main]
  schedule:
    - cron: "7,37 * * * *"   # 每半小時（第 7、37 分），GitHub 可能延後幾分鐘
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 抓取中央氣象署與環境部資料
        env:
          CWA_KEY: ${{ secrets.CWA_KEY }}
          MOENV_KEY: ${{ secrets.MOENV_KEY }}
          OUT_DIR: _site/data
        run: node scripts/fetch.mjs
      - name: 整理網站檔案
        run: cp -r index.html manifest.webmanifest icons _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
