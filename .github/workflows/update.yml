name: 更新天氣資料並發布網站

on:
  push:
    branches: [main]
  schedule:
    - cron: "7,37 * * * *"   # 備援；主要由 cron-job.org 每 10 分鐘觸發
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 斷層圖層診斷（暫時）
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          for V in 1.0.0 1.0.3 1.1.1 1.3.0; do
            echo "== WMS $V"
            curl -s -m 30 "https://geomap.gsmma.gov.tw/mapguide/mapagent/mapagent.fcgi?SERVICE=WMS&REQUEST=GetCapabilities&VERSION=$V" | tr -d '\r' | grep -oE '<(Name|Title|SRS|CRS)>[^<]{1,120}</(Name|Title|SRS|CRS)>' | sort -u | head -80
          done
          echo "== WFS"
          curl -s -m 30 "https://geomap.gsmma.gov.tw/mapguide/mapagent/mapagent.fcgi?SERVICE=WFS&REQUEST=GetCapabilities&VERSION=1.0.0" | tr -d '\r' | grep -oE '<(Name|Title)>[^<]{1,120}</(Name|Title)>' | sort -u | head -60
      - name: 安裝圖片與推播套件
        run: npm install --no-save --no-package-lock --no-audit --no-fund pngjs@7 jpeg-js@0.4 web-push@3
      - name: 抓取中央氣象署與環境部資料
        env:
          CWA_KEY: ${{ secrets.CWA_KEY }}
          MOENV_KEY: ${{ secrets.MOENV_KEY }}
          PUSH_SUB: ${{ secrets.PUSH_SUB }}
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
          OUT_DIR: _site/data
        run: node scripts/fetch.mjs
      - name: 整理網站檔案
        run: |
          cp -r index.html manifest.webmanifest sw.js push-config.json icons _site/
          sed -i "s/__BUILD__/${GITHUB_SHA}/" _site/index.html
          echo "{\"v\":\"${GITHUB_SHA}\"}" > _site/version.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
