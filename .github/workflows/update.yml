name: 更新天氣資料並發布網站

on:
  push:
    branches: [main]
  schedule:
    - cron: "7,37 * * * *"   # 備援；主要由 cron-job.org 每 10 分鐘觸發
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 斷層圖層診斷（暫時）
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          B="https://geomap.gsmma.gov.tw/mapguide/mapagent/mapagent.fcgi?SERVICE=WMS&REQUEST=GetMap&VERSION=1.1.1&LAYERS=WMS/25K_Geomap_fault_2021&STYLES=&FORMAT=image/png&TRANSPARENT=TRUE&WIDTH=400&HEIGHT=400"
          curl -s -m 40 "$B&SRS=EPSG:4326&BBOX=120.45,23.95,120.95,24.45" -o a.png; echo "WMSIMG A $(file -b a.png | cut -c1-40) $(base64 -w0 a.png)"
          curl -s -m 40 "$B&SRS=EPSG:3857&BBOX=13408000,2983000,13464000,3039000" -o b.png; echo "WMSIMG B $(file -b b.png | cut -c1-40) $(base64 -w0 b.png | cut -c1-60000)"
      - name: 安裝圖片與推播套件
        run: npm install --no-save --no-package-lock --no-audit --no-fund pngjs@7 jpeg-js@0.4 web-push@3
      - name: 抓取中央氣象署與環境部資料
        env:
          CWA_KEY: ${{ secrets.CWA_KEY }}
          MOENV_KEY: ${{ secrets.MOENV_KEY }}
          PUSH_SUB: ${{ secrets.PUSH_SUB }}
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
          OUT_DIR: _site/data
        run: node scripts/fetch.mjs
      - name: 整理網站檔案
        run: |
          cp -r index.html manifest.webmanifest sw.js push-config.json icons _site/
          sed -i "s/__BUILD__/${GITHUB_SHA}/" _site/index.html
          echo "{\"v\":\"${GITHUB_SHA}\"}" > _site/version.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
