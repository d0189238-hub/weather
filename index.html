<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>今天帶傘嗎</title>
<meta name="theme-color" content="#dbe7ee">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="帶傘嗎">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Serif+TC:wght@600&display=swap" rel="stylesheet">
<style>
/* 版面想法：一欄四段，用細線分段不用卡片 — 現在、空氣、逐三小時、建議。 */
:root {
  --paper: #eef1ee;
  --sky: #dbe7ee;      /* 頁面頂端的天色 */
  --ink: #14242b;
  --muted: #55666d;
  --line: #c6d1d5;
  --marker: #f2b100;   /* 太陽與雨傘的黃 */
  --rain: #1f6f8b;
  --good: #2f8f5b;
  --warn: #d99a00;
  --bad: #c8502d;
  --cloth: #dbe6ea; --cloth2: #a9c0ca;    /* 衣物與雲的底色 */
  --tl: 38%;            /* 溫度色的明度 */

  --display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --body: "LXGW WenKai TC", "Kaiti TC", "BiauKai", "DFKai-SB", "Noto Serif TC", serif;

  /* 字級：16 起跳，比例 1.5 */
  --t0: 18px; --t1: 27px; --t3: 72px;
  /* 間距：4 的倍數 */
  --s1: 8px; --s2: 16px; --s3: 24px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f181c; --sky: #16232a; --ink: #e7eef0; --muted: #94a5ab; --line: #2a393f;
    --marker: #f0b400; --rain: #6bb6d1; --good: #57b884; --warn: #e6b02e; --bad: #e27a58; --tl: 64%; --cloth: #2b4049; --cloth2: #1b2a31;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f181c; --sky: #16232a; --ink: #e7eef0; --muted: #94a5ab; --line: #2a393f;
  --marker: #f0b400; --rain: #6bb6d1; --good: #57b884; --warn: #e6b02e; --bad: #e27a58; --tl: 64%; --cloth: #2b4049; --cloth2: #1b2a31;
  color-scheme: dark;
}

/* 底色跟著當地的白天黑夜走，優先於裝置的深淺色設定 */
:root[data-sky="day"] {
  --paper: #eef1ee; --sky: #dbe7ee; --ink: #14242b; --muted: #55666d; --line: #c6d1d5;
  --marker: #f2b100; --rain: #1f6f8b; --good: #2f8f5b; --warn: #d99a00; --bad: #c8502d;
  --cloth: #dbe6ea; --cloth2: #a9c0ca; --tl: 38%;
  color-scheme: light;
}
:root[data-sky="night"] {
  --paper: #121829; --sky: #1f2a4a; --ink: #ece8dd; --muted: #9aa4b8; --line: #2d3852;
  --marker: #f2c14e; --rain: #7fb8d8; --good: #5fbf8c; --warn: #e6b84a; --bad: #e58463;
  --cloth: #34446a; --cloth2: #222e4c; --tl: 68%;
  color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  background: var(--paper) linear-gradient(var(--sky), var(--paper) 360px) no-repeat;
  color: var(--ink);
  transition: background-color .6s, color .6s;
  font-family: var(--body);
  font-size: var(--t0);
  font-weight: 400;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
}
main {
  max-width: 520px;
  margin: 0 auto;
  padding: var(--s2) 20px var(--s3);
  display: flex;
  flex-direction: column;
}
section { padding: var(--s3) 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: var(--s2); }
.muted { color: var(--muted); }
h2 { font-size: var(--t0); font-weight: 400; color: var(--muted); }
svg.ic { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
svg.ic .sun { stroke: var(--marker); }
svg.ic .sun circle, svg.ic path.sun { fill: var(--marker); }
svg.ic .c { fill: var(--cloth); }
svg.gi { width: 48px; height: 48px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
svg.gi .f { fill: var(--cloth); }
svg.gi .a { fill: var(--marker); }
svg.gi .cf { fill: var(--cloth); stroke: none; }
svg.gi .cs { fill: var(--cloth2); stroke: none; }
svg.gi .l { stroke-width: 1.2; opacity: .55; }
svg.gi .dot { fill: currentColor; stroke: none; }
svg.ic .wet { stroke: var(--rain); }

/* 頂列 */
.top { display: flex; justify-content: space-between; align-items: center; gap: var(--s2); padding-bottom: var(--s2); color: var(--muted); }
#place-btn {
  font: inherit; font-weight: 600; font-size: var(--t1); color: var(--ink);
  background: transparent; border: 0; border-bottom: 2px solid var(--ink); border-radius: 0;
  padding: 4px 0; cursor: pointer; display: flex; align-items: center; gap: var(--s1);
}
[hidden] { display: none !important; }
.btn {
  font: inherit; font-weight: 600; padding: 8px 16px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--ink); background: var(--ink); color: var(--paper);
}
.btn.ghost { background: transparent; color: var(--ink); }
.panel { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 10; overflow: auto; background: var(--paper) linear-gradient(var(--sky), var(--paper) 360px) no-repeat; }
.panel-in { max-width: 520px; margin: 0 auto; padding: var(--s2) 20px var(--s3); display: flex; flex-direction: column; gap: var(--s3); }
.ptitle { font-size: var(--t1); font-weight: 600; }
.plist { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.prow { display: flex; align-items: center; gap: var(--s1); border-bottom: 1px solid var(--line); }
.pick {
  flex: 1; min-width: 0; display: grid; grid-template-columns: 32px 1fr auto; align-items: center; gap: 12px;
  padding: 14px 0; font: inherit; color: inherit; background: none; border: 0; text-align: left; cursor: pointer;
}
.pick b { font-weight: 600; }
.pick small { display: block; font-size: 14px; color: var(--muted); font-weight: 400; }
.pick .t { font-family: var(--display); font-size: var(--t1); font-weight: 600; }
.padd { display: flex; flex-direction: column; gap: var(--s1); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s1); }
.pair select {
  font: inherit; min-width: 0; padding: 8px; border-radius: 6px;
  border: 1px solid var(--muted); background: var(--paper); color: var(--ink);
}
:focus-visible { outline: 2px solid var(--rain); outline-offset: 3px; }

/* 現在 */
.now { display: flex; align-items: center; gap: var(--s3); }
.now .big svg.ic { width: 72px; height: 72px; stroke-width: 1.4; display: block; }
.now .big { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.now .desc { font-size: var(--t1); font-weight: 600; line-height: 1.2; }
.now .read { display: flex; flex-direction: column; gap: 4px; }
.duo { display: grid; grid-template-columns: auto auto; justify-content: start; gap: 40px; }
.duo div { display: flex; flex-direction: column; gap: 4px; }
.duo b { font-family: var(--display); font-weight: 600; font-size: 64px; line-height: 1; letter-spacing: -0.02em; }
.meta { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s1) var(--s3); }
.meta div { display: flex; justify-content: space-between; gap: var(--s1); }
.meta span:last-child { font-weight: 600; text-align: right; }

/* 空氣 */
.air { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s3); }
.air > div { display: flex; flex-direction: column; gap: 4px; border-left: 6px solid var(--c, var(--line)); padding-left: 12px; }
.air b { font-size: var(--t1); font-weight: 600; line-height: 1.2; }

.poll { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s2) var(--s3); }
.poll div { display: flex; flex-direction: column; }
.poll b { font-weight: 600; font-size: 20px; }
.hist { display: flex; flex-direction: column; gap: var(--s1); }
.bars { display: flex; align-items: flex-end; gap: 2px; height: 64px; border-bottom: 1px solid var(--line); }
.bars i { flex: 1; min-height: 2px; border-radius: 2px 2px 0 0; background: var(--c, var(--line)); }
.axis { display: flex; justify-content: space-between; }

/* 一週、日出日落、過去 24 小時 */
.chart.wchart { height: 200px; }
.legend { display: flex; gap: var(--s2); }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; background: var(--c); }
.chart path { fill: none; stroke-width: 2.5; vector-effect: non-scaling-stroke; }
.chart path.band { fill: var(--cloth); stroke: none; opacity: .75; }
.chart path.hi { stroke: var(--bad); }
.chart path.lo { stroke: var(--rain); }
.wchart i { border: 2px solid var(--paper); }
.wchart i.hi { background: var(--bad); }
.wchart i.lo { background: var(--rain); }
.wchart span { position: absolute; transform: translateX(-50%); font-weight: 600; line-height: 1; }
.wchart span.hi { color: var(--bad); }
.wchart span.lo { color: var(--rain); }
.sm { font-size: 14px; }

/* 分頁：首頁、天氣詳細、空氣詳細 */
main:not([data-view="home"]) .v-home, main:not([data-view="air"]) .v-air,
main:not([data-view="weather"]) .v-weather, main:not([data-view="obs"]) .v-obs, main[data-view="home"] .v-sub { display: none; }
.dots { display: flex; justify-content: center; gap: 8px; padding-bottom: var(--s2); }
.dots[hidden] { display: none; }
.dots button { width: 24px; height: 24px; padding: 0; border: 0; background: none; display: grid; place-items: center; cursor: pointer; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); opacity: .4; transition: transform .2s, opacity .2s; }
.dots .on i { background: var(--ink); opacity: 1; transform: scale(1.3); }
main { touch-action: pan-y; }
.sat-h { display: flex; justify-content: space-between; align-items: center; gap: var(--s2); }
.sat-t { display: flex; gap: 4px; }
.sat-t button { font: inherit; font-size: 16px; min-height: 36px; padding: 4px 12px; border: 1px solid var(--line); border-radius: 18px; background: none; color: var(--muted); cursor: pointer; }
.sat-t button.on { border-color: var(--ink); color: var(--ink); }
.v-obs[hidden], #obs-home[hidden] { display: none; }
.map { position: relative; display: block; border-radius: 8px; overflow: hidden; background: var(--cloth2); }
.map img { display: block; width: 100%; height: auto; min-height: 120px; }
.map svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
.map .lt { fill: #ffd400; stroke: #4a3a00; stroke-width: 2; }
.map .lt.g { fill: #ff3b30; stroke: #fff; }
.map .me { fill: none; stroke: #111; stroke-width: 5; }
.map .me2 { fill: #fff; stroke: #111; stroke-width: 3; }
.cap { font-size: 16px; color: var(--muted); }
.thumb { display: grid; grid-template-columns: 112px 1fr; gap: var(--s2); align-items: center; }
.thumb img { width: 112px; height: 112px; object-fit: cover; border-radius: 6px; background: var(--cloth2); }
.thumb .lines { display: flex; flex-direction: column; gap: 6px; }
.uvbig { display: flex; align-items: baseline; gap: var(--s2); }
.uvbig b { font-family: var(--display); font-size: var(--t3); line-height: 1; font-weight: 500; }
.uvgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.uvgrid div { display: flex; justify-content: space-between; gap: 6px; padding: 6px 10px; border-radius: 6px; background: var(--cloth); font-size: 16px; }
.uvgrid b { font-weight: 600; }
.uvk { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
.rank { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s2); }
.rank ol { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 16px; }
.rank li { display: flex; justify-content: space-between; gap: 4px; }
.rank li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank h3 { margin: 0 0 6px; font-size: 16px; font-weight: 600; }
.top.v-sub { color: var(--ink); justify-content: flex-start; }
.top.v-sub strong { font-size: 20px; font-weight: 600; min-width: 0; }
#back { white-space: nowrap; flex: none; }
.tap { display: flex; flex-direction: column; gap: var(--s2); cursor: pointer; border-radius: 6px; }
.chev { display: inline-flex; align-items: center; gap: 4px; align-self: flex-end; color: var(--rain); font-weight: 600; }
.flagline { display: flex; justify-content: space-between; align-items: center; gap: var(--s2); }
.flag { display: inline-flex; align-items: center; gap: var(--s1); font-weight: 600; }
.flag svg { width: 28px; height: 28px; flex: none; }
.flag.big { font-size: var(--t1); }
.flag.big svg { width: 44px; height: 44px; }
.gauge { position: relative; width: 220px; max-width: 70%; align-self: center; }
.gauge svg { display: block; width: 100%; }
.gauge circle { fill: none; stroke-width: 9; }
.gauge .trk { stroke: var(--line); }
.gauge .arc { stroke: var(--c, var(--line)); stroke-linecap: round; transition: stroke-dasharray .6s; }
.g-in { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.g-in b { font-family: var(--display); font-weight: 600; font-size: 72px; line-height: 1; }
.scale { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; position: relative; padding: 6px 0; }
.scale span { height: 10px; background: var(--c); }
.scale span:first-child { border-radius: 5px 0 0 5px; }
.scale span:nth-child(6) { border-radius: 0 5px 5px 0; }
.scale i { position: absolute; top: 50%; width: 20px; height: 20px; border-radius: 50%; transform: translate(-50%, -50%); background: var(--c); border: 3px solid var(--ink); }
.scale-n { display: grid; grid-template-columns: repeat(6, 1fr); }
.fl-n { color: var(--bad); font-weight: 600; }
.chart.pchart { height: 124px; border-bottom: 1px solid var(--line); }
.pchart path.area { fill: var(--cloth); stroke: none; opacity: .75; }
.pchart polyline { stroke: var(--ink); stroke-width: 2; }
.pchart span { position: absolute; font-weight: 600; line-height: 1; white-space: nowrap; }
.axis b { font-weight: 600; }
.daybar { height: 4px; border-radius: 2px; background: var(--line); position: relative; margin: var(--s1) 0; }
.daybar i { position: absolute; top: 50%; width: 16px; height: 16px; border-radius: 50%; background: var(--marker); transform: translate(-50%, -50%); }
.daybar i[hidden] { display: none; }
.spark { height: 56px; border-bottom: 1px solid var(--line); }
.spark svg { width: 100%; height: 100%; display: block; }
.spark polyline { fill: none; stroke: var(--ink); stroke-width: 2; vector-effect: non-scaling-stroke; }
.bars.rain { height: 40px; }
.bars.rain i { background: var(--rain); min-height: 0; }

/* 逐三小時 */
.row7 { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; align-items: center; }
.row7 .cell { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.row7 .cell.first { font-weight: 600; }
.chart { position: relative; height: 80px; }
.chart svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.chart polyline.fl { stroke: var(--bad) !important; stroke-dasharray: 3 4; }
.chart polyline { fill: none; stroke: var(--muted); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.chart i { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: hsl(var(--h) 65% var(--tl)); border: 2px solid var(--paper); transform: translate(-50%, -50%); }
.chart i.first { width: 16px; height: 16px; }
.temp { font-weight: 600; font-size: 20px; color: hsl(var(--h) 65% var(--tl)); }
.swing { font-size: var(--t1); font-weight: 600; line-height: 1.3; }
.tag { border: 1px solid var(--muted); border-radius: 4px; padding: 0 2px; }
.wetpct { color: var(--rain); font-weight: 600; }

/* 建議 */
.head { display: flex; justify-content: space-between; align-items: center; gap: var(--s2); flex-wrap: wrap; }
.tabs { display: flex; border: 1px solid var(--ink); border-radius: 6px; overflow: hidden; }
.tabs button {
  font: inherit; color: var(--ink); background: transparent; border: 0; padding: 4px 12px; cursor: pointer;
  border-left: 1px solid var(--ink);
}
.tabs button:first-child { border-left: 0; }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--paper); font-weight: 600; }
.wear { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s3); }
.item { display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 600; text-align: center; line-height: 1.3; }
.wear svg.gi { width: 88px; height: 88px; stroke-width: 1.8; }
.tips { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s1); padding-top: var(--s2); border-top: 1px dashed var(--line); }
.tips .item { font-weight: 400; }
.tips .item.off { color: var(--muted); }
.tips .item.off svg.gi { opacity: .4; }
.tips .item.off svg.gi .a { fill: var(--cloth); }

.note { color: var(--muted); padding-top: var(--s2); border-top: 1px solid var(--line); }
.note[hidden], .hist[hidden] { display: none; }

@media (prefers-reduced-motion: no-preference) {
  section { animation: rise .45s cubic-bezier(.2,.7,.2,1) backwards; }
  section:nth-of-type(2) { animation-delay: .08s; }
  section:nth-of-type(3) { animation-delay: .16s; }
  section:nth-of-type(4) { animation-delay: .24s; }
}
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
</style>
</head>
<body>
<main id="app" data-view="home">
  <div class="top v-home">
    <button type="button" id="place-btn" aria-haspopup="dialog"><span id="place-name"></span><svg viewBox="0 0 12 12" width="14" height="14" aria-hidden="true"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <span id="updated"></span>
  </div>
  <div class="dots" id="dots" role="tablist" aria-label="我的地點" hidden></div>
  <div class="top v-sub">
    <button type="button" class="btn ghost" id="back">‹ 返回</button>
    <strong id="sub-title"></strong>
  </div>

  <!-- 首頁 -->
  <section class="v-home" aria-live="polite">
    <div class="now">
      <div class="big"><span id="icon"></span></div>
      <div class="read">
        <span class="desc" id="desc"></span>
        <span class="muted" id="range"></span>
      </div>
    </div>
    <div class="tap" role="button" tabindex="0" data-go="weather">
      <div class="duo">
        <div><span class="muted">溫度</span><b id="now"></b></div>
        <div><span class="muted">體感溫度</span><b id="feels"></b></div>
      </div>
      <span class="chev">天氣詳細<svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M4 2l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </div>
  </section>

  <section class="v-home">
    <h2>空氣品質</h2>
    <div class="tap" role="button" tabindex="0" data-go="air">
      <div class="air">
        <div id="aqi-box"><span class="muted">AQI</span><b id="aqi">—</b><span id="aqi-lv"></span></div>
        <div id="pm-box"><span class="muted">PM2.5</span><b id="pm">—</b><span id="pm-lv"></span></div>
      </div>
      <div class="flagline"><span class="flag" id="flag-home"></span><span class="chev">空氣詳細<svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M4 2l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
    </div>
  </section>

  <section class="v-home">
    <h2>逐三小時預報　接下來 18 小時</h2>
    <p class="swing" id="swing"></p>
    <div>
      <div class="row7" id="f-top"></div>
      <div class="chart" id="f-chart"></div>
      <div class="row7" id="f-bot"></div>
    </div>
  </section>

  <section class="v-home">
    <div class="head">
      <h2>穿著與生活建議</h2>
      <div class="tabs" id="tabs" role="group" aria-label="時段"></div>
    </div>
    <div class="wear" id="wear"></div>
    <p class="muted" id="wear-note"></p>
    <div class="tips" id="tips"></div>
  </section>

  <section class="v-home">
    <h2>一週預報</h2>
    <div>
      <div class="row7" id="w-top"></div>
      <div class="chart wchart" id="w-chart"></div>
    </div>
    <div class="legend sm"><span style="--c:var(--bad)">每日最高溫</span><span style="--c:var(--rain)">每日最低溫</span></div>
  </section>

  <section class="v-home">
    <h2>日出日落</h2>
    <div>

const BIG = { tee: 1, long: 1, jacket: 1, sweater: 1, puffer: 1, scarf: 1 };   // 衣物用 64 格
const gi = k => '<svg class="gi" viewBox="0 0 ' + (BIG[k] ? "64 64" : "48 48") + '" aria-hidden="true">' + GI[k] + '</svg>';
function wearItems(feels) {
  return feels >= 28 ? [["輕便短袖", "tee"]] :
    feels >= 24 ? [["短袖", "tee"], ["薄外套", "jacket"]] :
    feels >= 20 ? [["薄長袖", "long"], ["薄外套", "jacket"]] :
    feels >= 16 ? [["長袖", "long"], ["外套", "jacket"]] :
    feels >= 12 ? [["毛衣", "sweater"], ["厚外套", "puffer"]] : [["羽絨外套", "puffer"], ["圍巾", "scarf"]];
}
const hue = t => Math.round(Math.max(5, Math.min(215, 215 - (t - 10) / 24 * 210)));
function tipsFor(p) {
  const rain = p.prob >= 50, maybe = p.prob >= 30;
  return [
    rain ? { t: "要帶傘 " + p.prob + "%", ic: "umbrella" } :
    maybe ? { t: "帶摺傘 " + p.prob + "%", ic: "umbrella" } : { t: "不用帶傘", ic: "umbrella", off: true },
    p.uv >= 6 ? { t: "注意防曬", ic: "sun" } : { t: "不必防曬", ic: "sun", off: true },
    maybe ? { t: "不宜晾衣", ic: "laundry", off: true } : { t: "適合晾衣", ic: "laundry" },
    (maybe || p.feels >= 33) ? { t: "不宜運動", ic: "run", off: true } : { t: "適合運動", ic: "run" }
  ];
}
function periods(hours) {
  const names = { "-1": "清晨前", 0: "今天白天", 1: "今晚", 2: "明天白天", 3: "明晚" };
  const map = new Map();
  for (const x of hours) {
    const k = Math.floor((x.day * 24 + x.h - 6) / 12);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(x);
  }
  return [...map.entries()].slice(0, 3).map(([k, list]) => ({
    name: names[k] || "之後",
    feels: list.reduce((s, x) => s + x.feels, 0) / list.length,
    hi: Math.max(...list.map(x => x.temp)),
    lo: Math.min(...list.map(x => x.temp)),
    prob: Math.max(...list.map(x => x.prob)),
    uv: Math.max(...list.map(x => x.uv))
  }));
}

/* ---------- 畫面 ---------- */
let current = null, tab = 0;

function renderTips() {
  const ps = periods(current.hours);
  if (tab >= ps.length) tab = 0;
  const tabs = $("tabs");
  tabs.textContent = "";
  ps.forEach((p, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = p.name;
    b.setAttribute("aria-pressed", i === tab);
    b.addEventListener("click", () => { tab = i; renderTips(); });
    tabs.appendChild(b);
  });
  const p = ps[tab];
  $("wear").innerHTML = wearItems(p.feels).map(([name, k]) => `<div class="item">${gi(k)}<span>${name}</span></div>`).join("");
  const diff = Math.round(p.hi) - Math.round(p.lo);
  $("wear-note").textContent = `這個時段 ${Math.round(p.lo)}° ~ ${Math.round(p.hi)}°，體感約 ${Math.round(p.feels)}°，溫差 ${diff}°` + (diff >= 6 ? "，穿好脫的" : "");
  $("tips").innerHTML = tipsFor(p).map(t => `<div class="item${t.off ? " off" : ""}">${gi(t.ic)}<span>${t.t}</span></div>`).join("");
}

function renderForecast(hours) {
  const cols = [hours[0]];
  for (let i = 1; i < hours.length && cols.length < 7; i++) if (hours[i].h % 3 === 0) cols.push(hours[i]);
  const temps = cols.map(c => c.temp), lo = Math.min(...temps), hi = Math.max(...temps);
  const y = t => 12 + (1 - (t - lo) / ((hi - lo) || 1)) * 56;
  const x = i => (i + 0.5) / cols.length * 100;

  const tlo = Math.min(...temps), thi = Math.max(...temps), d = Math.round(thi) - Math.round(tlo), last = cols[cols.length - 1];
  const span = (last.day - cols[0].day) * 24 + last.h - cols[0].h;
  $("swing").textContent = `${Math.round(tlo)}° ~ ${Math.round(thi)}°　溫差 ${d}°`;
  $("f-top").innerHTML = cols.map((c, i) =>
    `<div class="cell${i ? "" : " first"}">${icon(c.code, c.isDay)}<span class="${c.prob >= 50 ? "wetpct" : ""}">${c.prob}%</span></div>`).join("");
  $("f-chart").innerHTML =
    `<svg viewBox="0 0 100 80" preserveAspectRatio="none" aria-hidden="true"><polyline points="${cols.map((c, i) => x(i) + "," + y(c.temp)).join(" ")}"/></svg>` +
    cols.map((c, i) => `<i class="${i ? "" : "first"}" style="--h:${hue(c.temp)};left:${x(i)}%;top:${y(c.temp)}px"></i>`).join("");
  $("f-bot").innerHTML = cols.map((c, i) => {
    const label = i === 0 ? "現在" : c.h === 0 ? '<span class="tag">明日</span>' : c.h + "時";
    return `<div class="cell${i ? "" : " first"}"><span class="temp" style="--h:${hue(c.temp)}">${Math.round(c.temp)}°</span><span class="muted">${label}</span></div>`;
  }).join("");
}

function render(d) {
  current = d;
  document.documentElement.dataset.sky = d.cur.isDay ? "day" : "night";
  const c = d.cur;
  $("updated").textContent = d.sample ? "示範資料" : d.time + " 更新";
  $("note").textContent = d.sample ? "這裡顯示的是示範資料，還沒讀到氣象署與環境部的資料。" : d.source;
  $("icon").innerHTML = icon(c.code, c.isDay);
  $("desc").textContent = c.desc || codeName(c.code);
  $("now").textContent = c.temp.toFixed(1) + "°";
  $("feels").textContent = Math.round(c.feels) + "°";
  $("range").textContent = Math.round(d.lo) + "° ~ " + Math.round(d.hi) + "°";
  $("precip").textContent = c.precip + " mm";
  $("hum").textContent = c.hum == null ? "—" : Math.round(c.hum) + "%";
  $("uv").textContent = uvLevel(c.uv);
  $("wind").textContent = c.wind == null ? "—" : (c.wdir == null ? "" : windDir(c.wdir) + " ") + c.wind.toFixed(1) + " m/s";

  $("now2").textContent = $("now").textContent; $("feels2").textContent = $("feels").textContent;
  if (d.aq) {
    const v = Math.round(d.aq.aqi), L = aqiLevel(v), P = pmLevel(d.aq.pm);
    $("aqi").textContent = v; $("aqi-lv").textContent = L.name; $("aqi-box").style.setProperty("--c", L.color);
    $("pm").textContent = Math.round(d.aq.pm); $("pm-lv").textContent = P.name; $("pm-box").style.setProperty("--c", P.color);
    $("flag-home").innerHTML = flagSvg(L.color) + L.flag;
    $("flag").innerHTML = flagSvg(L.color) + `<span>${L.flag}・${L.name}</span>`;
    $("aq-tip").textContent = L.tip;
    $("g-num").textContent = v;
    const C = 2 * Math.PI * 50;
    $("g-arc").style.setProperty("--c", L.color);
    $("g-arc").style.strokeDasharray = (Math.min(v, 300) / 300 * C) + " " + C;
    const lower = L.i ? AQI_LV[L.i - 1][0] : 0, upper = L.i < 5 ? AQI_LV[L.i][0] : 500;
    const pos = (L.i + Math.min(1, (v - lower) / (upper - lower))) / 6 * 100;
    $("aq-scale").innerHTML = AQI_LV.map(r => `<span style="--c:${r[3]}"></span>`).join("") + `<i style="--c:${L.color};left:${pos}%"></i>`;
    const items = [["PM2.5", d.aq.pm, "μg/m³", 0], ["PM10", d.aq.pm10, "μg/m³", 0], ["臭氧 O₃", d.aq.o3, "ppb", 0],
      ["二氧化氮 NO₂", d.aq.no2, "ppb", 0], ["二氧化硫 SO₂", d.aq.so2, "ppb", 0], ["一氧化碳 CO", d.aq.co, "ppm", 2]];
    $("poll").innerHTML = items.filter(x => x[1] != null).map(x =>
      `<div><span class="muted">${x[0]}</span><b>${Number(x[1]).toFixed(x[3])}</b><span class="muted sm">${x[2]}</span></div>`).join("");
    const hist = d.aq.hist || [];
    $("hist").hidden = !hist.length;
    if (hist.length) {
      const vs = hist.map(x => x.v), top = Math.max(...vs, 50);
      $("aq-range").textContent = `AQI ${Math.min(...vs)} ~ ${Math.max(...vs)}`;
      $("aq-bars").innerHTML = hist.map(x => `<i style="--c:${aqiLevel(x.v).color};height:${x.v / top * 100}%"></i>`).join("");
      $("aq-from").textContent = "昨天 " + hist[0].h + "時";
    }
  } else {
    $("poll").textContent = ""; $("hist").hidden = true;
    for (const k of ["aqi", "pm", "g-num"]) $(k).textContent = "—";
    $("aqi-lv").textContent = $("pm-lv").textContent = $("aq-tip").textContent = "暫時讀不到";
    $("flag-home").textContent = $("flag").textContent = $("aq-scale").textContent = "";
    $("g-arc").style.strokeDasharray = "0 400";
  }
  renderForecast(d.hours);
  renderTips();
  renderMore(d);
}

const dayLabel = (off, date) => off === 0 ? "今天" : off === 1 ? "明天" : "週" + "日一二三四五六"[date.getDay()];
const toMin = t => Number(t.slice(0, 2)) * 60 + Number(t.slice(3, 5));
function renderMore(d) {
  const w = d.week, n = w.length, H = 200;
  const min = Math.min(...w.map(v => v.lo)), max = Math.max(...w.map(v => v.hi));
  const y = t => 42 + (1 - (t - min) / ((max - min) || 1)) * (H - 88), x = i => (i + 0.5) / n * 100;
  const spline = pts => {
    let s = "M" + pts[0].join(" ");
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
      s += ` C${p1[0] + (p2[0] - p0[0]) / 6} ${p1[1] + (p2[1] - p0[1]) / 6} ${p2[0] - (p3[0] - p1[0]) / 6} ${p2[1] - (p3[1] - p1[1]) / 6} ${p2[0]} ${p2[1]}`;
    }
    return s;
  };
  const hp = w.map((v, i) => [x(i), y(v.hi)]), lp = w.map((v, i) => [x(i), y(v.lo)]);
  $("w-top").innerHTML = w.map((v, i) =>
    `<div class="cell${i ? "" : " first"}"><span>${v.label}</span><span class="muted sm">${v.date}</span>${icon(v.code, true)}` +
    `<span class="${v.prob >= 50 ? "wetpct" : "muted"}">${v.prob == null ? "—" : v.prob + "%"}</span></div>`).join("");
  $("w-chart").innerHTML =
    `<svg viewBox="0 0 100 ${H}" preserveAspectRatio="none" aria-hidden="true">` +
    `<path class="hi" d="${spline(hp)}"/><path class="lo" d="${spline(lp)}"/></svg>` +
    w.map((v, i) =>
      `<i class="hi" style="left:${x(i)}%;top:${y(v.hi)}px"></i><span class="hi" style="left:${x(i)}%;top:${y(v.hi) - 30}px">${Math.round(v.hi)}°</span>` +
      `<i class="lo" style="left:${x(i)}%;top:${y(v.lo)}px"></i><span class="lo" style="left:${x(i)}%;top:${y(v.lo) + 12}px">${Math.round(v.lo)}°</span>`).join("");

  const r = toMin(d.sun.rise), t = toMin(d.sun.set), len = t - r, pos = (d.nowMin - r) / len;
  $("rise").textContent = d.sun.rise; $("set").textContent = d.sun.set;
  $("daylen").textContent = `白天 ${Math.floor(len / 60)} 小時 ${len % 60} 分`;
  $("sunpos").hidden = pos < 0 || pos > 1;
  $("sunpos").style.left = pos * 100 + "%";

  $("past-sec").hidden = d.past.length < 2;
  if (d.past.length < 2) return;
  const ps = d.past, ts = ps.map(v => v.temp), lo = Math.min(...ts), hi = Math.max(...ts), m = ps.length, PH = 124;
  const px = k => k / (m - 1) * 100, py = t => 32 + (1 - (t - lo) / ((hi - lo) || 1)) * (PH - 66);
  const pts = ps.map((v, k) => px(k) + "," + py(v.temp)).join(" ");
  const tag = (k, above) => {
    const xx = px(k), tr = xx < 18 ? "0" : xx > 82 ? "-100%" : "-50%", yy = py(ps[k].temp);
    return `<i style="--h:${hue(ps[k].temp)};left:${xx}%;top:${yy}px"></i>` +
      `<span style="left:${xx}%;top:${yy + (above ? -28 : 12)}px;transform:translateX(${tr})">${above ? "最高" : "最低"} ${ps[k].temp.toFixed(1)}°・${ps[k].h}時</span>`;
  };
  $("past-t").textContent = `氣溫　現在 ${ps[m - 1].temp.toFixed(1)}°`;
  $("past-chart").innerHTML =
    `<svg viewBox="0 0 100 ${PH}" preserveAspectRatio="none" aria-hidden="true"><path class="area" d="M0 ${PH} L${pts.replace(/ /g, " L")} L100 ${PH} Z"/><polyline points="${pts}"/></svg>` +
    tag(ts.indexOf(hi), true) + tag(ts.indexOf(lo), false);
  $("past-axis").innerHTML = [0, 6, 12, 18, m - 1].map(k =>
    `<span>${k === m - 1 ? "現在" : (k === 0 ? "昨天 " : "") + ps[k].h + "時"}</span>`).join("");
  const rs = ps.map(x => x.rain), top = Math.max(...rs, 1);
  $("past-r").textContent = `累積雨量 ${rs.reduce((a, b) => a + b, 0).toFixed(1)} mm`;
  $("past-bars").innerHTML = rs.map(v => `<i style="height:${v / top * 100}%"></i>`).join("");
  $("past-from").textContent = "昨天 " + ps[0].h + "時";
}

/* ---------- 資料 ---------- */
function sample(lat, seed = 0) {
  const start = new Date().getHours();
  const base = 21 + (25 - lat) * 1.5 + (seed % 7 - 3) * 0.5, wet = [1, 0.3, 0.6][seed % 3];
  const hours = [];
  for (let i = 0; i < 36; i++) {
    const h = (start + i) % 24, isDay = h >= 6 && h < 18;
    const temp = base + 3 * Math.cos((h - 14) / 24 * 2 * Math.PI);
    const prob = Math.round((h >= 14 && h <= 19 ? 70 : h >= 12 && h <= 21 ? 40 : 10) * wet / 10) * 10;
    hours.push({
      day: Math.floor((start + i) / 24), h, isDay, temp, feels: temp + 1, prob,
      code: prob >= 70 ? 61 : prob >= 40 ? 3 : 1,
      uv: isDay ? Math.max(0, 7 * Math.sin((h - 6) / 12 * Math.PI)) : 0
    });
  }
  const n = hours[0];
  return {
    sample: true,
    cur: { temp: n.temp, feels: n.feels, hum: 74, precip: n.prob >= 70 ? 1.2 : 0, wind: 2.4, wdir: 45, code: n.code, isDay: n.isDay, uv: n.uv },
    hi: base + 3, lo: base - 3,
    week: [70, 40, 10, 20, 60, 30, 10].map((prob, i) => {
      const dt = new Date(); dt.setDate(dt.getDate() + i);
      return { label: dayLabel(i, dt), date: (dt.getMonth() + 1) + "/" + dt.getDate(), prob, code: prob >= 60 ? 61 : prob >= 30 ? 3 : 1, lo: base - 3 + Math.sin(i) * 1.5, hi: base + 3 + Math.cos(i) * 2 };
    }),
    sun: { rise: "06:08", set: "17:10" },
    nowMin: new Date().getHours() * 60 + new Date().getMinutes(),
    past: Array.from({ length: 24 }, (_, i) => {
      const h = (start + 1 + i) % 24;
      return { h, temp: base + 3 * Math.cos((h - 14) / 24 * 2 * Math.PI), rain: h >= 15 && h <= 17 ? 1.1 : 0 };
    }),
    aq: (a => ({
      aqi: a, pm: Math.round(a * 0.3), pm10: Math.round(a * 0.55), o3: 42, no2: 11, so2: 2, co: 0.32,
      hist: Array.from({ length: 24 }, (_, i) => ({ h: (start + 1 + i) % 24, v: i === 23 ? a : Math.round(a * (0.8 + 0.2 * Math.sin(i / 3.5))) }))
    }))([48, 118, 82][seed % 3]),
    hours
  };
}

/* 真實資料：GitHub Actions 定時向中央氣象署、環境部抓好，存在 data/ 底下 */
const FILE = {"宜蘭縣":"001","桃園市":"005","新竹縣":"009","苗栗縣":"013","彰化縣":"017","南投縣":"021","雲林縣":"025","嘉義縣":"029","屏東縣":"033","臺東縣":"037","花蓮縣":"041","澎湖縣":"045","基隆市":"049","新竹市":"053","嘉義市":"057","臺北市":"061","高雄市":"065","新北市":"069","臺中市":"073","臺南市":"077","連江縣":"081","金門縣":"085"};
const dataCache = {};
function countyData(c) {
  if (!dataCache[c]) {
    dataCache[c] = fetch("data/" + FILE[c] + ".json", { cache: "no-cache" })
      .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .catch(e => { delete dataCache[c]; throw e; });
  }
  return dataCache[c];
}
/* 氣象署天氣現象代碼 → 這裡的圖示代碼 */
function wxCode(c) {
  c = Number(c);
  if (c === 1) return 0;
  if (c === 2 || c === 3) return 2;
  if (c >= 4 && c <= 7) return 3;
  if (c >= 24 && c <= 28) return 45;
  if ([15, 16, 17, 18, 21, 22, 33, 34, 35, 36, 41].includes(c)) return 95;
  return 61;
}
/* 日出日落（分鐘，臺灣時間），用天文公式算 */
function sunTimes(lat, lon, date) {
  const t = new Date(date.getTime() + 8 * 3600e3);
  const n = Math.floor((Date.UTC(t.getUTCFullYear(), t.getUTCMonth(), t.getUTCDate()) - Date.UTC(t.getUTCFullYear(), 0, 0)) / 864e5);
  const g = 2 * Math.PI / 365 * (n - 1), rad = Math.PI / 180;
  const eq = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g) - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
  const dec = 0.006918 - 0.399912 * Math.cos(g) + 0.070257 * Math.sin(g) - 0.006758 * Math.cos(2 * g) + 0.000907 * Math.sin(2 * g) - 0.002697 * Math.cos(3 * g) + 0.00148 * Math.sin(3 * g);
  const ha = Math.acos(Math.cos(90.833 * rad) / (Math.cos(lat * rad) * Math.cos(dec)) - Math.tan(lat * rad) * Math.tan(dec)) / rad;
  return { rise: Math.round(720 - 4 * (lon + ha) - eq + 480), set: Math.round(720 - 4 * (lon - ha) - eq + 480) };
}
const hhmm = m => String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
const twDay = ms => Math.floor((ms + 8 * 3600e3) / 864e5);

function fromData(T, D) {
  const now = new Date(), nowMs = now.getTime(), today = twDay(nowMs);
  const sun = sunTimes(T.lat, T.lon, now);
  const isDayAt = h => h * 60 + 30 >= sun.rise && h * 60 + 30 < sun.set;
  const tw = new Date(nowMs + 8 * 3600e3), nowMin = tw.getUTCHours() * 60 + tw.getUTCMinutes();
  const week = T.w.map(r => ({ r, day: twDay(Date.parse(r[0] + "T00:00:00+08:00")) })).filter(x => x.day >= today && x.r[1] != null && x.r[2] != null).slice(0, 7)
    .map(x => ({
      label: dayLabel(x.day - today, new Date(x.r[0] + "T12:00:00+08:00")), date: Number(x.r[0].slice(5, 7)) + "/" + Number(x.r[0].slice(8, 10)),
      hi: x.r[1], lo: x.r[2], code: wxCode(x.r[3]), prob: x.r[4], uv: x.r[5], day: x.day
    }));
  const uvOf = day => { const w = week.find(x => x.day === day); return w && w.uv != null ? w.uv : 0; };
  const rows = T.f.map(r => ({ r, ms: Date.parse(r[0]) }));
  let start = 0;
  rows.forEach((x, i) => { if (x.ms <= nowMs) start = i; });
  const hours = rows.slice(start, start + 48).map(x => {
    const h = new Date(x.ms + 8 * 3600e3).getUTCHours(), day = twDay(x.ms) - today, isDay = isDayAt(h);
    return { day, h, isDay, temp: x.r[1], feels: x.r[2] == null ? x.r[1] : x.r[2], prob: x.r[3] == null ? 0 : x.r[3], code: wxCode(x.r[4]), text: x.r[5], uv: isDay ? uvOf(day + today) : 0 };
  });
  if (!hours.length || !week.length) throw new Error("no forecast");
  const h0 = hours[0], o = T.o, a = T.a, nowDay = nowMin >= sun.rise && nowMin < sun.set;
  return {
    sample: false,
    time: o && o.time ? o.time.slice(11, 16) : (D.updated || "").slice(11, 16),
    source: "資料來源：中央氣象署" + (o ? "（觀測站：" + o.station + "）" : "") + (a ? "、環境部（測站：" + a.site + "）" : "") + "。本頁每半小時抓一次最新資料；預報內容以氣象署發布為準，空氣品質為環境部每小時發布。",
    cur: {
      temp: o && o.temp != null ? o.temp : h0.temp, feels: h0.feels, hum: o ? o.rh : null, precip: o && o.rain != null ? o.rain : 0,
      wind: o ? o.ws : null, wdir: o ? o.wd : null, code: h0.code, desc: h0.text, isDay: nowDay, uv: nowDay ? uvOf(today) : 0
    },
    hi: week[0].hi, lo: week[0].lo, week, hours, past: [],
    sun: { rise: hhmm(sun.rise), set: hhmm(sun.set) }, nowMin,
    aq: a && a.aqi != null ? { aqi: a.aqi, pm: a.pm25, pm10: a.pm10, o3: a.o3, no2: a.no2, so2: a.so2, co: a.co, hist: [] } : null
  };
}

/* ---------- 地點 ---------- */
const pname = p => p.c + p.t;
const seedOf = s => [...s].reduce((a, ch) => (a * 31 + ch.charCodeAt(0)) % 9973, 7);
let OB = null, satKind = "ir", here = null;
let places = [{ c: "臺北市", t: "中正區" }], active = 0, editing = false, liveOK = false;
try {
  const saved = JSON.parse(store.get("places") || "null");

    const ok = saved.filter(p => p && COUNTY[p.c] && COUNTY[p.c].towns.includes(p.t));

} catch (e) {}

async function load() {

/* ---------- 左右滑動換地點 ---------- */
function renderDots() {
  const el = $("dots");
  el.hidden = places.length < 2;
  el.innerHTML = places.map((p, i) => `<button type="button" role="tab" class="${i === active ? "on" : ""}" data-i="${i}" aria-selected="${i === active}" aria-label="${pname(p)}"><i></i></button>`).join("");
}
function slideTo(i, dir) {
  if (i < 0 || i >= places.length || i === active) return;
  const m = $("app"), calm = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  active = i; savePlaces();
  if (calm) { m.style.transform = ""; load(); return; }
  m.style.transition = "transform .16s ease-in, opacity .16s ease-in";
  m.style.transform = `translateX(${-dir * 40}%)`; m.style.opacity = "0";
  setTimeout(() => {
    load(); window.scrollTo(0, 0);
    m.style.transition = "none"; m.style.transform = `translateX(${dir * 40}%)`;
    void m.offsetWidth;
    m.style.transition = "transform .24s cubic-bezier(.2,.7,.2,1), opacity .24s";
    m.style.transform = ""; m.style.opacity = "";
  }, 170);
}
$("dots").addEventListener("click", e => {
  const b = e.target.closest("[data-i]");
  if (b) { const i = Number(b.dataset.i); slideTo(i, i > active ? 1 : -1); }
});
(() => {
  const m = $("app");
  let x0 = 0, y0 = 0, dx = 0, mode = 0;                 // mode: 0 未定、1 橫向、2 直向
  m.addEventListener("touchstart", e => {
    mode = 2; dx = 0;
    if (e.touches.length !== 1 || places.length < 2) return;
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
    if (x0 < 24 || x0 > window.innerWidth - 24) return;  // 留給瀏覽器的邊緣手勢
    mode = 0; m.style.transition = "none";
  }, { passive: true });
  m.addEventListener("touchmove", e => {
    if (mode === 2) return;
    const ax = e.touches[0].clientX - x0, ay = e.touches[0].clientY - y0;
    if (mode === 0) {
      if (Math.abs(ax) < 10 && Math.abs(ay) < 10) return;
      mode = Math.abs(ax) > Math.abs(ay) * 1.5 ? 1 : 2;
      if (mode === 2) return;
    }
    const edge = (ax > 0 && active === 0) || (ax < 0 && active === places.length - 1);
    dx = edge ? ax * 0.25 : ax;                          // 到頭了就拉不太動
    m.style.transform = `translateX(${dx}px)`;
  }, { passive: true });
  const end = () => {
    if (mode !== 1) { mode = 2; return; }
    mode = 2;
    const next = active + (dx < 0 ? 1 : -1);
    if (Math.abs(dx) > 56 && next >= 0 && next < places.length) slideTo(next, dx < 0 ? 1 : -1);
    else { m.style.transition = "transform .2s"; m.style.transform = ""; }
  };
  m.addEventListener("touchend", end);
  m.addEventListener("touchcancel", end);
  document.addEventListener("keydown", e => {
    if (!$("panel").hidden || /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
    if (e.key === "ArrowRight") slideTo(active + 1, 1);
    if (e.key === "ArrowLeft") slideTo(active - 1, -1);
  });
})();

/* ---------- 觀測圖 ---------- */

const twTime = v => {
  if (!v) return "";
  const t = new Date(/[zZ]|[+-]\d\d:?\d\d$/.test(v) ? v : v.replace(" ", "T") + "+08:00");
  if (isNaN(t)) return "";
  const w = new Date(t.getTime() + 8 * 3600e3);
  return (w.getUTCMonth() + 1) + "/" + w.getUTCDate() + " " + hhmm(w.getUTCHours() * 60 + w.getUTCMinutes());
};
const kmTo = (a, b, c, d) => { const r = Math.PI / 180, x = (d - b) * r * Math.cos((a + c) / 2 * r), y = (c - a) * r; return Math.sqrt(x * x + y * y) * 6371; };
const UVL = v => v < 3 ? ["低量", "#4caf50"] : v < 6 ? ["中量", "#f2c200"] : v < 8 ? ["高量", "#f08a24"] : v < 11 ? ["過量", "#e0412b"] : ["危險", "#8e44ad"];
function setImg(key, m) {
  const src = "data/" + m.file + "?t=" + encodeURIComponent(m.time || "");
  $(key + "-img").src = src; $(key + "-link").href = src;
}
function drawObs() {
  if (!OB) return;
  const M = OB.maps, L = OB.light, O = OB.obs;
  const show = (id, on) => { $(id).hidden = !on; };
  // 雷達＋閃電
  show("o-radar", !!M.radar);
  let near = null, n = 0, g = 0;
  if (L && L.pts) {
    n = L.pts.length; g = L.pts.filter(p => p[2]).length;
    if (here) L.pts.forEach(p => { const d = kmTo(here.lat, here.lon, p[1], p[0]); if (near === null || d < near) near = d; });
  }
  const lightText = !L ? "" : n === 0 ? "過去 1 小時沒有閃電" : `過去 1 小時閃電 ${n} 次` + (g ? `（打到地面 ${g} 次）` : "") + (near !== null ? `，離你最近 ${near < 10 ? near.toFixed(1) : Math.round(near)} 公里` : "");
  if (M.radar) {
    setImg("radar", M.radar);
    $("radar-thumb").src = $("radar-img").src;
    $("radar-cap").textContent = "觀測時間 " + twTime(M.radar.time) + "・顏色越紅越紫，雨越大";
    const lo = M.radar.lon, la = M.radar.lat;
    let svg = "";
    if (lo && la) {
      const X = x => (x - lo[0]) / (lo[1] - lo[0]) * 1000, Y = y => (la[1] - y) / (la[1] - la[0]) * 1000;
      if (L && L.pts) svg += L.pts.map(p => `<circle class="lt${p[2] ? " g" : ""}" cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="${p[2] ? 10 : 8}"/>`).join("");
      if (here) svg += `<circle class="me" cx="${X(here.lon).toFixed(1)}" cy="${Y(here.lat).toFixed(1)}" r="16"/><circle class="me2" cx="${X(here.lon).toFixed(1)}" cy="${Y(here.lat).toFixed(1)}" r="6"/>`;
    }
    $("radar-svg").innerHTML = svg;
    $("light-cap").textContent = lightText ? lightText + (n ? "。紅點是打到地面的閃電，黃點是雲裡的閃電" : "") + (here ? "，黑圈是你選的地點。" : "。") : "";
  }
  $("light-home").textContent = lightText || "雷達回波";
  show("obs-home", !!(M.radar || M.ir || M.vis || M.rain || M.temp || O));
  // 衛星雲圖
  const names = { ir: "紅外線", vis: "可見光" }, have = Object.keys(names).filter(k => M[k]);
  show("o-sat", have.length > 0);
  if (have.length) {
    if (!M[satKind]) satKind = have[0];
    const x = M[satKind];
    $("sat-img").src = $("sat-link").href = "data/" + x.file + "?t=" + encodeURIComponent(x.time || "");
    $("sat-time").textContent = (twTime(x.time) ? "觀測時間 " + twTime(x.time) + "・" : "") + (satKind === "vis" ? "可見光只有白天看得到，晚上請看紅外線" : "越白越亮的地方，雲越高越厚");
    $("sat-tabs").innerHTML = have.length > 1 ? have.map(k => `<button type="button" class="${k === satKind ? "on" : ""}" data-k="${k}">${names[k]}</button>`).join("") : "";
  }
  show("o-rain", !!M.rain); if (M.rain) { setImg("rain", M.rain); $("rain-cap").textContent = "從今天 0 點累積到 " + twTime(M.rain.time); }
  show("o-temp", !!M.temp); if (M.temp) { setImg("temp", M.temp); $("temp-cap").textContent = "觀測時間 " + twTime(M.temp.time); }
  // 紫外線
  const uv = O && O.uv ? O.uv : [];
  show("o-uv", uv.length > 0);
  if (uv.length) {
    let best = null, bd = Infinity;
    if (here) uv.forEach(u => { const d = kmTo(here.lat, here.lon, u[4], u[5]); if (d < bd) { bd = d; best = u; } });
    if (best) {
      const lv = UVL(best[3]);
      $("uv-now").textContent = best[3];
      $("uv-lv").innerHTML = `<span class="uvk" style="background:${lv[1]}"></span>${lv[0]}`;
      $("uv-cap").textContent = `離你最近的 ${best[0]} 站，約 ${Math.round(bd)} 公里・${twTime(O.time)} 觀測`;
    } else { $("uv-now").textContent = ""; $("uv-lv").textContent = ""; $("uv-cap").textContent = twTime(O.time) + " 觀測"; }
    $("uv-grid").innerHTML = uv.slice().sort((a, b) => b[3] - a[3]).map(u => `<div><span><span class="uvk" style="background:${UVL(u[3])[1]}"></span>${u[0]}</span><b>${u[3]}</b></div>`).join("");
  }
  // 排行榜
  const hasRank = O && (O.hi && O.hi.length || O.lo && O.lo.length);
  show("o-rank", !!hasRank);
  if (hasRank) {
    const col = (t, list, unit) => `<div><h3>${t}</h3><ol>` + (list && list.length ? list.map(r => `<li><span>${r[0]}</span><b>${r[3]}${unit}</b></li>`).join("") : `<li><span class="muted">今天還沒下雨</span></li>`) + "</ol></div>";
    $("rank").innerHTML = col("最高溫", O.hi, "°") + col("最低溫", O.lo, "°") + col("雨量", O.rain, "");
    $("rank-cap").textContent = "全臺測站，今天 0 點到 " + twTime(O.time) + "；雨量單位是毫米。";
  }
}
$("sat-tabs").addEventListener("click", e => { const b = e.target.closest("[data-k]"); if (b) { satKind = b.dataset.k; drawObs(); } });
async function loadObs() {
  const get = f => fetch("data/" + f, { cache: "no-cache" }).then(r => r.ok ? r.json() : null).catch(() => null);
  const [m, l, o] = await Promise.all([get("maps.json"), get("lightning.json"), get("obs.json")]);
  OB = { maps: m || {}, light: l, obs: o };
  drawObs();
}
loadObs();

/* 開著不關、或從背景切回來時，自動換成最新資料 */
let lastLoad = Date.now();
async function refresh() {
  if (Date.now() - lastLoad < 10 * 60e3) return;
  lastLoad = Date.now();
  const p = places[active];
  for (const k in dataCache) delete dataCache[k];
  try {
    const D = await countyData(p.c), T = D.towns[p.t];
    if (T && places[active] === p) render(fromData(T, D));
  } catch (e) {}
  loadObs();
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
setInterval(() => { if (!document.hidden) refresh(); }, 5 * 60e3);

/* 鄉鎮名單以氣象署資料為準 */
fetch("data/towns.json", { cache: "no-cache" }).then(r => r.ok ? r.json() : null).then(t => {
  if (!t) return;
  for (const c in t) if (COUNTY[c] && t[c].length) COUNTY[c].towns = t[c];
  fillTowns();
  const before = pname(places[active]);
  places = places.filter(p => COUNTY[p.c].towns.includes(p.t));
  if (!places.length) places = [{ c: "臺北市", t: COUNTY["臺北市"].towns[0] }];
  active = Math.max(0, places.findIndex(p => pname(p) === before));
  savePlaces(); load();
}).catch(() => {});
</script>
